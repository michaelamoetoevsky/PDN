# Issue ledger gate.
#
# Re-runs every issue's verification predicate against the pushed tree, including the gated
# behaviour checks, so a silently regressed fix fails here instead of turning up later. Closing an
# issue records an intention; a refactor, a revert, or a conflict resolved the wrong way can quietly
# undo it.
#
# Deliberately separate from ci.yml: ci.yml filters on crates/**, tests/**, Cargo.*, deny.toml and
# .github/workflows/**, so it never runs for changes under scripts/ or docs/. That is how an
# unverified predicate change reached master unnoticed - the gate itself was outside the paths that
# trigger CI. This workflow therefore has NO path filter: it runs on every push and pull request to
# these branches, so a change to a predicate is always exercised against the tree it claims to
# verify.
#
# Only THIS workflow is expected of pull requests: it runs unconditionally, while the other
# workflows are path-filtered. A required status check that never runs cannot be satisfied, so
# requiring a path-filtered workflow would block every doc-only pull request forever.
#
# --offline keeps the gate independent of gh, tokens, rate limits and the network: no unrelated
# outage can fail it, or silently skip it.

name: Issue ledger

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name IS the status-check name that branch protection matches on, so it is short and
  # stable on purpose. Renaming it silently invalidates the required check.
  issue-ledger:
    name: Issue ledger
    runs-on: ubuntu-latest
    # The gated checks compile bench targets and run three test binaries from a cold cache, so the
    # five-minute source-only budget is not enough. Anything much above this would hide a hang.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: a failing predicate reports the last commit that touched the file it
          # greps, which is what distinguishes "the fix regressed" from "the predicate is stale".
          fetch-depth: 0

      - name: Install Rust toolchain
        # Required by the gated behaviour checks. --cargo runs cargo plainly on a runner: the memory
        # guard (`heavy`) exists for this project's Android dev device, and the harness detects its
        # absence instead of invoking a wrapper that does not exist here.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ledger-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ledger-cargo-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # The gate. stdout is the JSON summary (consumed below), stderr is the human table and lands
      # in the job log. The exit status is recorded rather than propagated so the summary always
      # prints, and the last step is what actually fails the job.
      - name: Run the issue ledger (source predicates + gated behaviour checks)
        run: |
          python3 scripts/build_issue_ledger.py --offline --cargo --json > ledger.json
          echo $? > ledger.rc

      - name: Summarise
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          try:
              d = json.load(open("ledger.json"))
          except Exception as e:
              print(f"could not read ledger.json: {e}")
              raise SystemExit(0)
          c = d["checks"]
          print(f"checks: {c['pass']} PASS, {c['fail']} FAIL, {c['skipped']} SKIPPED (of {c['total']})")
          print(f"head: {d['head']}  cargo_enabled: {d['cargo_enabled']}")
          if d["failures"]:
              print("\nfailures:")
              for f in d["failures"]:
                  print(f"  #{f['issue']} {f['claim']}")
                  print(f"    {f.get('reason') or 'no reason recorded'}")
          if d["skipped_gated"]:
              print(f"\n{len(d['skipped_gated'])} gated cargo checks were not run (no verdict); a SKIPPED check is not evidence the fix works.")
          EOF

      - name: Check the v0.1.9 non-goals (scope-creep gate)
        # Roadmap section 9.4 promises things this release will not do. A promise with no check is
        # a slogan, so the gate measures the real binary's command list, the recorded line ceilings
        # and the absence of an image store or a TUI. It rides in this workflow because it needs a
        # built binary, which this job already has: a separate workflow would pay for the same
        # build again and be cancelled by the same concurrency.
        run: |
          cargo build -p podnext --locked --quiet
          python3 scripts/check_non_goals.py --binary target/debug/podnext

      - name: Check the warning ceiling (ratchet)
        # 290 warnings scroll past this build and nothing counted them, so the split's own residue
        # (unused imports left behind by moving symbols out of commands/mod.rs) was invisible. The
        # ceiling only moves down.
        #
        # `--cold` is the point, not a detail: rustc caches its diagnostics along with the artefacts,
        # so a `cargo check` after this job's build re-emits NOTHING and the comparison would pass
        # while measuring zero. A gate that cannot fail is worse than no gate, so this one pays for a
        # fresh target directory and reads the real counts.
        #
        # Exit 2 is "cannot measure": the baseline is stored per toolchain, and this runner uses
        # `stable`, which moves on its own. That is not a defect in the tree, so it must not fail the
        # build - but it must not pass quietly either. It prints the counts it measured and says the
        # ratchet did not run.
        run: |
          set +e
          python3 scripts/check_warnings.py compare --cold
          rc=$?
          if [ "$rc" = "2" ]; then
            echo "::warning title=Warning ratchet did not run::no baseline recorded for this runner's toolchain. Exit 2 means cannot measure - it is never a pass. Record it deliberately with: python3 scripts/check_warnings.py record --cold"
            exit 0
          fi
          exit $rc

      - name: Execute the reference's examples (documentation is code)
        # cli_reference_contract proves every documented command and flag EXISTS. Nothing has ever run
        # the fenced EXAMPLES, so an example could be fiction in exactly the way a phantom flag is -
        # the class of defect #42 and #64 are about. The harness executes what it can against the
        # binary this job already built and prints a reason for every block it excludes, so an
        # exclusion is visible rather than silent. A skip (no binary) prints that it is not a pass
        # and exits 0; a failure exits 1 and fails this job.
        run: |
          python3 scripts/check_doc_examples.py --binary target/debug/podnext
          # The bindings harness needs an installed container, which a runner has not got: both of its
          # unmeasurable paths (no binary, no usable container) print a skip and exit 0, so wiring it
          # costs nothing and keeps it discoverable. No `|| true` here: with those paths verified to
          # exit 0, any non-zero exit is a real failure or a wiring bug, and both must fail the job.
          python3 scripts/check_bindings.py --binary target/debug/podnext

      - name: The help contract (123 screens against a tracked fixture)
        # cli_reference_contract proves every documented command and flag EXISTS. It cannot see a refactor
        # that changes a help SCREEN without changing a documented name - and that is exactly what a
        # text edit or a module split does. This compares the freshly built binary's dump against a fixture
        # committed in the repository, so a help-text change without the fixture is a red build instead of
        # something the next round discovers in an untracked scratch file.
        run: |
          python3 scripts/dump_cli_help.py target/debug/podnext > help-dump.txt 2> help-dump.count
          cat help-dump.count
          if ! cmp -s help-dump.txt research/cli-help-baseline.txt; then
            echo "::error::the help dump differs from research/cli-help-baseline.txt - a change to help text must update that fixture in the same commit"
            diff help-dump.txt research/cli-help-baseline.txt | head -20
            exit 1
          fi
          # A check that prints nothing on success cannot be told apart from a check that never ran -
          # and Actions echoes this whole `run:` body into the log, so a reader grepping for the failure
          # string above gets a hit from the source itself. Print a positive beacon instead.
          echo "IDENTICAL: $(wc -c < help-dump.txt) bytes, sha256 $(sha256sum help-dump.txt | cut -c1-24)"

      - name: Fail if the ledger reported a FAIL
        if: always()
        run: |
          rc=$(cat ledger.rc 2>/dev/null || echo 1)
          echo "ledger exit status: $rc"
          test "$rc" = "0"
