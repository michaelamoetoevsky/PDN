name: Benchmark

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for baseline comparison

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install criterion
        run: cargo install cargo-criterion

      - name: Run benchmarks
        run: |
          cargo bench --workspace --no-run 2>&1 | tail -20
          cargo bench --workspace 2>&1 | tee benchmark-output.txt

      - name: Compare with baseline
        if: github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name == github.repository
        run: |
          # Get baseline from main branch
          git fetch origin main:main
          git stash
          git checkout main
          cargo bench --workspace 2>&1 | tee benchmark-baseline.txt
          git checkout -
          git stash pop
          
          # Compare results (simplified - in practice use criterion's comparison)
          echo "::notice::Benchmark comparison completed. Check artifacts for details."

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-output.txt
            benchmark-baseline.txt
          retention-days: 30

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('benchmark-output.txt')) {
              const output = fs.readFileSync('benchmark-output.txt', 'utf8');
              const body = `## Benchmark Results\n\n\`\`\`\n${output.slice(-2000)}\n\`\`\`\n\nFull results available in workflow artifacts.`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }