name: Benchmark

on:
  push:
    branches: [master, develop]
    paths:
      - 'crates/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
  pull_request:
    branches: [master, develop]
    paths:
      - 'crates/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `pull-requests: write` lets the result-comment step post on same-repo PRs.
    # Fork PRs still get a read-only token, so that step is `continue-on-error`
    # below: a missing comment must never turn a green benchmark run red.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for baseline comparison

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install criterion
        run: cargo install cargo-criterion

      - name: Verify benchmark targets exist and compile
        run: |
          set -euo pipefail
          # A green benchmark check must mean benchmarks actually ran. Two things have
          # to hold, and the guard that was here only checked the first:
          #   1. the workspace declares [[bench]] targets, and
          #   2. those targets COMPILE.
          # Condition 2 was silently false: the bench sources had drifted from the
          # crate APIs (`cargo bench` failed with 26 errors — E0432/E0422/E0560/E0599)
          # while this workflow reported success, because the `| tee` below masked the
          # exit status. Checking only for the `[[bench]]` marker gave a green tick
          # over a target that could not build.
          if ! grep -rq --include=Cargo.toml "^\[\[bench\]\]" crates/ Cargo.toml; then
            echo "::error::No [[bench]] targets found in the workspace; cargo bench would measure nothing."
            exit 1
          fi
          grep -rn --include=Cargo.toml "^\[\[bench\]\]" crates/ Cargo.toml
          # Build them, so "the targets exist" also means "the targets build".
          cargo bench --workspace --locked --no-run

      - name: Run benchmarks
        run: |
          # Two things are load-bearing here.
          #
          # 1. `set -o pipefail`: GitHub Actions' default `bash -e` reports only the
          #    LAST command's status, so `cargo bench ... | tee file` returned tee's
          #    0 and a failed run was invisible to the job.
          #
          # 2. The suite is BOUNDED on purpose. Unbounded `cargo bench` uses
          #    criterion's defaults (100 samples, 3s warm-up, 5s measurement) for
          #    every case, and some cases here are not cheap -- `sandbox_creation/
          #    create_sandbox` builds a real sandbox. Measured on this repo, the
          #    unbounded suite is not predictable: 25.7 min on one revision, over
          #    43 min and still climbing on the next, and a PR's baseline step was
          #    killed with SIGTERM (exit 143) 51s into that single case.
          #
          #    A CI benchmark job is a smoke signal and a regression tripwire, not a
          #    measurement laboratory. Bound each case here; take full-suite numbers
          #    from a deliberate run.
          #
          # `--bench benchmarks` is REQUIRED for the criterion flags to land on the
          # right harness: `cargo bench -- <args>` also feeds them to the libtest
          # harness of lib/lib test, which rejects them with
          # `error: Unrecognized option: 'warm-up-time'`.
          set -euo pipefail
          cargo bench --workspace --bench benchmarks --locked -- \
            --warm-up-time 1 --measurement-time 3 --sample-size 10 2>&1 \
            | tee benchmark-output.txt

      - name: Compare with baseline
        if: github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name == github.repository
        run: |
          set -euo pipefail
          # Derive the baseline from the PR's base branch at runtime, so this does not
          # hardcode a default branch name that may not exist (repo default: master).
          BASEREF="${{ github.base_ref }}"
          git fetch origin "$BASEREF:$BASEREF"
          # No stash dance. A CI checkout has no local changes to preserve, and the
          # stash/pop pair is actively harmful here: `git stash` finds nothing to save and
          # `git stash pop` then exits 1, which aborts the step (observed: "No stash entries
          # found." + "##[error]Process completed with exit code 128") AFTER the benchmarks ran.
          # This step only runs on pull_request, so master stayed green while every PR died here.
          git checkout "$BASEREF"
          # Same bounding as the step above, and for the same reason: this runs the
          # suite a second time, against the base branch. Left unbounded it is the
          # step that actually died -- exit 143 (SIGTERM) 51s into
          # `sandbox_creation/create_sandbox`.
          cargo bench --workspace --bench benchmarks --locked -- \
            --warm-up-time 1 --measurement-time 3 --sample-size 10 2>&1 \
            | tee benchmark-baseline.txt
          git checkout -

          # Compare results (simplified - in practice use criterion's comparison)
          echo "::notice::Benchmark comparison completed. Check artifacts for details."

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-output.txt
            benchmark-baseline.txt
          retention-days: 30

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        # Observed failure (run 41848512267, job 126638857856): HTTP 403
        # "Resource not accessible by integration" from the createComment call.
        # The benchmark itself had already passed; the missing comment must not
        # mark the job failed, so this step is explicitly non-fatal.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('benchmark-output.txt')) {
              const output = fs.readFileSync('benchmark-output.txt', 'utf8');
              const body = `## Benchmark Results\n\n\`\`\`\n${output.slice(-2000)}\n\`\`\`\n\nFull results available in workflow artifacts.`;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
