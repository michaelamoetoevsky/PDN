name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Build and test on multiple platforms
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
        target: [aarch64-linux-android, x86_64-linux-android]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Find Android NDK Path
        run: |
          # Find the actual NDK path
          # nttld/setup-ndk installs at /opt/hostedtoolcache/ndk/r27c
          echo "Searching for NDK..."
          NDK_PATH="/opt/hostedtoolcache/ndk/r27c"
          
          # Wait for NDK to appear (with retries)
          for i in {1..30}; do
            if [ -d "$NDK_PATH" ]; then
              echo "Found NDK at: $NDK_PATH (attempt $i)"
              break
            fi
            echo "Waiting for NDK at $NDK_PATH (attempt $i/30)..."
            sleep 2
          done
          
          # If not found at default location, search
          if [ ! -d "$NDK_PATH" ]; then
            echo "NDK not at default location, searching..."
            # Check if NDK is at /opt/hostedtoolcache/ndk with version subdirectory
            if [ -d "/opt/hostedtoolcache/ndk" ]; then
              for subdir in $(ls -1 /opt/hostedtoolcache/ndk/ 2>/dev/null | sort -V); do
                if [ -d "/opt/hostedtoolcache/ndk/$subdir" ]; then
                  NDK_PATH="/opt/hostedtoolcache/ndk/$subdir"
                  echo "Found versioned NDK at: $NDK_PATH"
                  break
                fi
              done
            fi
          fi
          
          # If not found at default location, search
          if [ ! -d "$NDK_PATH" ]; then
            echo "NDK not at default location, searching..."
            NDK_PATH=$(find /opt -name "ndk" -type d 2>/dev/null | head -1)
          fi
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find /opt/hostedtoolcache -name "ndk" -type d 2>/dev/null | head -1)
          fi
          # Check for versioned subdirectories
          if [ -d "$NDK_PATH" ]; then
            for subdir in $(ls -1 "$NDK_PATH"/ 2>/dev/null | sort -V); do
              if [ -d "$NDK_PATH/$subdir" ] && [ -d "$NDK_PATH/$subdir/toolchains" ]; then
                NDK_PATH="$NDK_PATH/$subdir"
                echo "Found versioned NDK at: $NDK_PATH"
                break
              fi
            done
          fi
          if [ ! -d "$NDK_PATH" ]; then
            # Check common locations
            for p in /opt/ndk/r27c /opt/android/ndk/r27c /usr/local/android-ndk/r27c; do
              if [ -d "$p" ]; then
                NDK_PATH=$p
                break
              fi
            done
          fi
          if [ ! -d "$NDK_PATH" ]; then
            echo "ERROR: Could not find NDK"
            echo "Searching /opt..."
            find /opt -name "ndk" -type d 2>/dev/null
            echo "Searching /opt/hostedtoolcache..."
            find /opt/hostedtoolcache -name "ndk" -type d 2>/dev/null
            exit 1
          fi
          echo "Found NDK at: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          # Add NDK toolchain bin to PATH for llvm-ar, clang, etc.
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Verify NDK Path
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libclang-dev \
            clang \
            lld \
            cmake \
            ninja-build \
            protobuf-compiler

      - name: Install Android OpenSSL
        run: |
          # Install OpenSSL for Android targets
          mkdir -p /tmp/openssl-android
          cd /tmp/openssl-android
          # Download and build OpenSSL for Android
          # Using prebuilt from NDK if available, otherwise build
          if [ -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/openssl" ]; then
            echo "OpenSSL headers found in NDK sysroot"
            OPENSSL_DIR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr"
            OPENSSL_INCLUDE_DIR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
            OPENSSL_LIB_DIR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$TARGET"
            echo "OPENSSL_DIR=$OPENSSL_DIR" >> $GITHUB_ENV
            echo "OPENSSL_INCLUDE_DIR=$OPENSSL_INCLUDE_DIR" >> $GITHUB_ENV
            echo "OPENSSL_LIB_DIR=$OPENSSL_LIB_DIR" >> $GITHUB_ENV
            echo "OpenSSL headers found in NDK sysroot"
          else
            echo "Building OpenSSL for Android..."
            # Use NDK's prebuilt OpenSSL if available
            export OPENSSL_DIR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr"
            export OPENSSL_INCLUDE_DIR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
            export OPENSSL_LIB_DIR="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$TARGET"
          fi
        env:
          TARGET: ${{ matrix.target }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build workspace
        run: cargo build --workspace --release --target ${{ matrix.target }}
        env:
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++
          AR_aarch64_linux_android: llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
          CC_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang
          CXX_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang++
          AR_x86_64_linux_android: llvm-ar
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang

      - name: Run tests
        if: matrix.target != 'aarch64-linux-android' && matrix.target != 'x86_64-linux-android'
        run: cargo test --workspace --release --target ${{ matrix.target }}
        env:
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++
          AR_aarch64_linux_android: llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
          CC_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang
          CXX_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang++
          AR_x86_64_linux_android: llvm-ar
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang

      - name: Run clippy
        if: matrix.target != 'aarch64-linux-android' && matrix.target != 'x86_64-linux-android'
        run: cargo clippy --workspace --release --target ${{ matrix.target }} || true
        env:
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++
          AR_aarch64_linux_android: llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
          CC_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang
          CXX_x86_64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang++
          AR_x86_64_linux_android: llvm-ar
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang

      - name: Check formatting
        if: matrix.target != 'aarch64-linux-android' && matrix.target != 'x86_64-linux-android'
        run: cargo fmt --all --check || true

      - name: Build binaries for release
        if: matrix.target == 'aarch64-linux-android' || matrix.target == 'x86_64-linux-android'
        run: |
          mkdir -p release-artifacts
          cp target/${{ matrix.target }}/release/podnext release-artifacts/podnext-${{ matrix.target }}
          # Copy installer scripts
          cp install.sh release-artifacts/
          cp install-short.sh release-artifacts/
        shell: bash

      - name: Upload release artifacts
        if: matrix.target == 'aarch64-linux-android' || matrix.target == 'x86_64-linux-android'
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ matrix.target }}
          path: release-artifacts/
          retention-days: 30

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (security)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo-audit
        run: cargo audit --workspace || true

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run cargo-deny check
        run: cargo deny check advisories bans licenses sources || true

  # Generate release notes and create release
  create-release:
    name: Create Release
    needs: [build-and-test, security-audit]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (release)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-release
        run: cargo install cargo-release

      - name: Download release artifacts (aarch64)
        uses: actions/download-artifact@v4
        with:
          name: release-binaries-aarch64-linux-android
          path: release-artifacts-aarch64

      - name: Download release artifacts (x86_64)
        uses: actions/download-artifact@v4
        with:
          name: release-binaries-x86_64-linux-android
          path: release-artifacts-x86_64

      - name: Combine artifacts
        run: |
          mkdir -p release-artifacts
          cp release-artifacts-aarch64/* release-artifacts/ 2>/dev/null || true
          cp release-artifacts-x86_64/* release-artifacts/ 2>/dev/null || true

      - name: List downloaded artifacts
        run: |
          find release-artifacts -type f | sort

      - name: Generate changelog
        id: changelog
        run: |
          # Get version from tag or input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          
          # Generate changelog - simple version
          git log --pretty=format:"- %s (%h)" -n 50 > CHANGELOG.md
          
          # Output changelog and version
          echo "changelog=$(cat CHANGELOG.md | sed 's/"/\\"/g' | sed ':a;N;s/\n/\\n/g;ta')" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.version }}
          name: PDN ${{ steps.changelog.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            release-artifacts/podnext-aarch64-linux-android
            release-artifacts/podnext-x86_64-linux-android
            release-artifacts/install.sh
            release-artifacts/install-short.sh
          draft: false
          prerelease: ${{ contains(steps.changelog.outputs.version, 'alpha') || contains(steps.changelog.outputs.version, 'beta') || contains(steps.changelog.outputs.version, 'rc') }}

      - name: Verify release artifacts
        run: |
          ls -la release-artifacts/
          if [ -f "release-artifacts/podnext-aarch64-linux-android" ]; then
            file release-artifacts/podnext-aarch64-linux-android
            ./release-artifacts/podnext-aarch64-linux-android --version || true
          else
            echo "ERROR: podnext aarch64 binary not found!"
            exit 1
          fi
          if [ -f "release-artifacts/podnext-x86_64-linux-android" ]; then
            file release-artifacts/podnext-x86_64-linux-android
            ./release-artifacts/podnext-x86_64-linux-android --version || true
          else
            echo "ERROR: podnext x86_64 binary not found!"
            exit 1
          fi
          # Verify installer scripts
          if [ -f "release-artifacts/install.sh" ]; then
            echo "Installer script found: $(wc -l < release-artifacts/install.sh) lines"
          fi
          if [ -f "release-artifacts/install-short.sh" ]; then
            echo "Short installer found: $(wc -l < release-artifacts/install-short.sh) lines"
          fi

  # Publish to crates.io (optional, manual trigger)
  publish-crates:
    name: Publish to crates.io
    needs: create-release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (publish)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-release
        run: cargo install cargo-release

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish crates
        run: cargo release --workspace --no-publish --execute ${{ github.event.inputs.version }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}