# PDN CI/CD Pipeline
# 5-job pipeline: host build, Android cross-compile, security audit, integration test, release

name: PDN CI/CD

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
    paths:
      - 'crates/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'crates/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v1.0.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Job 1: Rust Host Build
  rust-host-build:
    name: Rust Host Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            pkg-config \
            libssl-dev \
            libudev-dev \
            libseccomp-dev \
            libcap-dev

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-features --locked

      - name: Build workspace (release)
        run: cargo build --workspace --release --locked

      - name: Run tests
        run: cargo test --workspace --release --locked -- --test-threads=4

      - name: Build podnext binary
        run: cargo build --package podnext --release --locked

      - name: Upload podnext artifact
        uses: actions/upload-artifact@v6
        with:
          name: podnext-${{ runner.os }}-${{ runner.arch }}
          path: target/release/podnext
          retention-days: 30

  # Job 2: Rust Android Cross-Compile
  rust-android-cross-compile:
    name: Rust Android Cross-Compile (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: Set up cargo config for Android
        run: |
          TOOLCHAIN_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${TOOLCHAIN_BIN}" >> $GITHUB_PATH
          ln -sf "${TOOLCHAIN_BIN}/llvm-ar" "${TOOLCHAIN_BIN}/aarch64-linux-android-ar"
          ln -sf "${TOOLCHAIN_BIN}/llvm-ranlib" "${TOOLCHAIN_BIN}/aarch64-linux-android-ranlib"

          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.aarch64-linux-android]
          linker = "${TOOLCHAIN_BIN}/aarch64-linux-android34-clang"
          ar = "${TOOLCHAIN_BIN}/llvm-ar"
          EOF

      - name: Build for Android aarch64
        run: |
          TOOLCHAIN_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="${TOOLCHAIN_BIN}/aarch64-linux-android34-clang"
          export CXX_aarch64_linux_android="${TOOLCHAIN_BIN}/aarch64-linux-android34-clang++"
          export AR_aarch64_linux_android="${TOOLCHAIN_BIN}/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${TOOLCHAIN_BIN}/aarch64-linux-android34-clang"
          cargo build --workspace --release --locked --target aarch64-linux-android

      - name: Verify Android binaries
        run: |
          file target/aarch64-linux-android/release/podnext
          file target/aarch64-linux-android/release/libproot_core.so || true
          file target/aarch64-linux-android/release/libproot_distro_core.so || true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pn-android-aarch64
          path: |
            target/aarch64-linux-android/release/podnext
            target/aarch64-linux-android/release/lib*.so
          retention-days: 30

  # Job 3: Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny and cargo-geiger
        run: cargo install cargo-deny cargo-geiger --locked

      - name: Verify deny.toml is committed
        run: test -f deny.toml

      # One gate, one config. A separate `cargo audit` step used to run here too,
      # which meant two tools with two acceptance lists: audit failed on all 35
      # advisory entries (including unsound/unmaintained warnings), while deny
      # would have honoured deny.toml. cargo-deny uses the same RustSec database
      # and enforces the policy documented in deny.toml, so it is the single
      # source of truth: vulnerabilities fail unless explicitly accepted, and
      # unmaintained/unsound surface as warnings.
      - name: Run cargo deny (advisories, licenses, bans, sources)
        run: cargo deny check advisories licenses bans sources

      # Informational: reports newer versions without failing the build. It used to
      # pass `--exit-code 1` and then swallow the failure with `|| true`, which
      # only made the step look like a gate without being one.
      - name: Report outdated dependencies
        run: |
          cargo install cargo-outdated --locked
          cargo outdated --workspace || true

      # This step used to run `cargo geiger --workspace --output-format json` and
      # pipe it through jq. cargo-geiger has NO json output: in 0.14
      # `--output-format` accepts only Ascii, GitHubMarkdown and Utf8 (default), and
      # asking for "json" panics with `Utf8ArgumentParsingFailed { value: "json",
      # cause: "Matching variant not found" }`. The step never worked — first it was
      # `command not found` (cargo-geiger was not installed) and later a panic, both
      # swallowed by `|| true`.
      #
      # Reported, not gated: an unsafe-code count is a census, and the workspace
      # legitimately uses `unsafe` for libc calls, so any threshold would be
      # arbitrary. The report is uploaded so the number is visible and can be
      # compared across runs.
      - name: Count unsafe code (report)
        run: |
          cargo geiger --workspace --output-format Ascii > geiger-report.txt
          cat geiger-report.txt

      - name: Upload security reports
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: |
            geiger-report.txt
          retention-days: 30

  # Job 5: Documentation Build
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdbook
        run: cargo install mdbook

      - name: Build documentation
        run: |
          if [ -d docs ]; then
            cd docs && mdbook build
          else
            echo "No docs directory found, skipping"
            exit 0
          fi

      - name: Upload documentation
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: docs/book/
          retention-days: 7

  # Job 6: Fuzzing
  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust (nightly for fuzzing)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzz targets (short run for CI)
        run: |
          cd fuzz
          timeout 300 cargo fuzz run fuzz_security_deserialize -- -max_total_time=60 || true
          timeout 300 cargo fuzz run fuzz_seccomp_deserialize -- -max_total_time=60 || true
          timeout 300 cargo fuzz run fuzz_capability_deserialize -- -max_total_time=60 || true

  # Job 7: PRoot Distro Integration Test
  proot-distro-integration-test:
    name: PRoot Distro Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Termux dependencies (simulated)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            proot \
            qemu-user-static \
            binfmt-support \
            curl \
            tar \
            gzip \
            xz-utils \
            bzip2

      - name: Build workspace
        run: cargo build --workspace --release --locked

      - name: Test podnext basic commands
        run: |
          ./target/release/podnext --version
          ./target/release/podnext info
          ./target/release/podnext list
          ./target/release/podnext image ls
          ./target/release/podnext network ls
          ./target/release/podnext volume ls

      - name: Test PRoot compatibility layer
        run: |
          # Test that the compatibility layer compiles and basic functions work
          cargo test --package proot-compat --release --locked
          cargo test --package proot-core --release --locked
          cargo test --package proot-distro-core --release --locked
          cargo test --package pn-gateway --release --locked
          cargo test --package pn-next --release --locked

      - name: Test gateway fail-safe mechanisms
        run: |
          cargo test --package pn-gateway fail_safe --release --locked -- --nocapture

      - name: Test guardrails
        run: |
          cargo test --package pn-gateway guardrails --release --locked -- --nocapture

      - name: Test health monitoring
        run: |
          cargo test --package pn-gateway health --release --locked -- --nocapture

      - name: Test metrics collection
        run: |
          cargo test --package pn-gateway metrics --release --locked -- --nocapture

  # Job 8: Release
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust-host-build, rust-android-cross-compile, security-audit, proot-distro-integration-test, docs, fuzz]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build release binaries (host)
        run: cargo build --workspace --release --locked

      - name: Build release binaries (Android aarch64)
        run: |
          TOOLCHAIN_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${TOOLCHAIN_BIN}" >> $GITHUB_PATH
          ln -sf "${TOOLCHAIN_BIN}/llvm-ar" "${TOOLCHAIN_BIN}/aarch64-linux-android-ar"
          ln -sf "${TOOLCHAIN_BIN}/llvm-ranlib" "${TOOLCHAIN_BIN}/aarch64-linux-android-ranlib"
          export CC_aarch64_linux_android="${TOOLCHAIN_BIN}/aarch64-linux-android34-clang"
          export CXX_aarch64_linux_android="${TOOLCHAIN_BIN}/aarch64-linux-android34-clang++"
          export AR_aarch64_linux_android="${TOOLCHAIN_BIN}/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${TOOLCHAIN_BIN}/aarch64-linux-android34-clang"
          cargo build --workspace --release --locked --target aarch64-linux-android

      - name: Create release archives
        id: create-archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          
          # Host release
          mkdir -p release/pdn-${VERSION}-linux-${{ runner.arch }}
          cp target/release/podnext release/pdn-${VERSION}-linux-${{ runner.arch }}/
          cp target/release/libproot_core.so release/pdn-${VERSION}-linux-${{ runner.arch }}/ 2>/dev/null || true
          cp target/release/libproot_distro_core.so release/pdn-${VERSION}-linux-${{ runner.arch }}/ 2>/dev/null || true
          cp target/release/libpn_gateway.so release/pdn-${VERSION}-linux-${{ runner.arch }}/ 2>/dev/null || true
          cp target/release/libpn_next.so release/pdn-${VERSION}-linux-${{ runner.arch }}/ 2>/dev/null || true
          cp README.md release/pdn-${VERSION}-linux-${{ runner.arch }}/
          cp LICENSE* release/pdn-${VERSION}-linux-${{ runner.arch }}/ 2>/dev/null || true
          
          # Android release
          mkdir -p release/pdn-${VERSION}-android-aarch64
          cp target/aarch64-linux-android/release/podnext release/pdn-${VERSION}-android-aarch64/
          cp target/aarch64-linux-android/release/lib*.so release/pdn-${VERSION}-android-aarch64/ 2>/dev/null || true
          cp README.md release/pdn-${VERSION}-android-aarch64/
          cp LICENSE* release/pdn-${VERSION}-android-aarch64/ 2>/dev/null || true
          
          # Create tarballs
          cd release
          tar czf pdn-${VERSION}-linux-${{ runner.arch }}.tar.gz pdn-${VERSION}-linux-${{ runner.arch }}/
          tar czf pdn-${VERSION}-android-aarch64.tar.gz pdn-${VERSION}-android-aarch64/
          
          # Generate checksums
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: PDN ${{ github.ref_name }}
          body: |
            ## PDN (PRoot Distro Next) ${{ github.ref_name }}
            
            Next-generation container platform for Termux/Android combining PRoot, PRoot-distro, and proot-compat into a unified Rust codebase.
            
            ### Features
            - **proot-core**: Core PRoot implementation with ptrace, syscall interception, VFS
            - **proot-distro-core**: Container lifecycle, image management, networking, storage
            - **proot-compat**: Termux/Android compatibility (platform shim, path translation, seccomp bypass, stub FS, mount helper, cgroup v2)
            - **pn-gateway**: Unified gateway with fail-safe, guardrails, health monitoring, metrics
            - **pn-next**: Advanced runtime, scheduler, security, API, workflow, plugin system
            - **podnext**: Full-featured CLI for container/image/network/storage/volume management
            
            ### Downloads
            - Linux x86_64: `pdn-${{ steps.create-archives.outputs.version }}-linux-x86_64.tar.gz`
            - Android aarch64: `pdn-${{ steps.create-archives.outputs.version }}-android-aarch64.tar.gz`
            
            ### Verification
            Check SHA256SUMS.txt for integrity verification.
          files: |
            release/*.tar.gz
            release/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

      - name: Publish to crates.io (optional)
        if: false  # Set to true when ready to publish
        run: |
          cargo publish --package proot-core
                  cargo publish --package proot-distro-core
                  cargo publish --package proot-compat
                  cargo publish --package pn-gateway
                  cargo publish --package pn-next
                  cargo publish --package podnext
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}