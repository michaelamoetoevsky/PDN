[package]
name = "pdn-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
tempfile = "3.0"

[dependencies.proot-compat]
path = "../crates/proot-compat"
features = []

[dependencies.proot-core]
path = "../crates/proot-core"
features = []

[dependencies.proot-distro-core]
path = "../crates/proot-distro-core"
features = []

[[bin]]
name = "fuzz_security_deserialize"
path = "fuzz_targets/fuzz_security_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_seccomp_deserialize"
path = "fuzz_targets/fuzz_seccomp_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_capability_deserialize"
path = "fuzz_targets/fuzz_capability_deserialize.rs"
test = false
doc = false
bench = false
