[package]
name = "pn-next"
version = "0.1.0"
edition = "2021"
description = "PN Next - Advanced architecture for PRoot Distro Next"
license = "GPL-2.0-or-later"
repository = "https://github.com/hermes-agent/PDN"

[features]
default = []
cri = []
profiling = ["dep:pprof", "dep:flamegraph"]

[dependencies]
proot-core = { path = "../proot-core" }
proot-distro-core = { path = "../proot-distro-core" }
proot-compat = { path = "../proot-compat" }
pn-gateway = { path = "../pn-gateway" }
libc = "0.2"
nix = { version = "0.27", features = ["mount", "process", "ptrace", "fs", "signal", "socket"] }
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
rustls = "0.21"
tokio-rustls = "0.24"
hyper = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tower-service = "0.3"
bytes = "1.0"
async-trait = "0.1"
parking_lot = "0.12"
crossbeam = "0.8"
futures = "0.3"
libloading = "0.8"
notify = "6.0"
oci-spec = "0.1"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
num_cpus = "1.16"
tonic = { version = "0.11", features = ["tls", "transport"] }
prost = { version = "0.12" }
prost-types = { version = "0.12" }
tokio-stream = { version = "0.1.8" }
rand = "0.8"
pprof = { version = "0.12", optional = true }
flamegraph = { version = "0.6", optional = true }
toml = "0.8"
petgraph = "0.6"
shellexpand = "3.0"
once_cell = "1.19"
regex = "1.10"
flate2 = "1.0"
sysinfo = "0.30"
serde_yaml = "0.9"
git2 = "0.18"
openssl = { version = "0.10", features = ["vendored"] }
walkdir = "2.3"
tar = "0.4"

[[bench]]
name = "benchmarks"
path = "benches/benchmarks.rs"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1.0", features = ["full", "macros"] }
tempfile = "3.0"