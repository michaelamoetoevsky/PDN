[package]
name = "proot-distro-core"
version = "0.1.0"
edition = "2021"
description = "PRoot Distro Core - Container management for PRoot"
license = "GPL-2.0-or-later"
repository = "https://github.com/hermes-agent/PDN"

[dependencies]
proot-core = { path = "../proot-core" }
libc = "0.2"
nix = { version = "0.27", features = ["mount", "process"] }
rustix = "0.38"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
dirs = "5.0"
tempfile = "3.0"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
bzip2 = "0.4"
xz2 = "0.1"
zstd = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
memmap2 = "0.9"
parking_lot = "0.12"