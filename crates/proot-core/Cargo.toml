[package]
name = "proot-core"
version.workspace = true
edition.workspace = true
description = "PRoot core Rust implementation - ptrace-based chroot alternative"
license.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["mount", "process", "ptrace"] }
rustix = "0.38"
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.0"
parking_lot = "0.12"
crossbeam = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.0", features = ["full", "macros"] }

[dev-dependencies]
tempfile = "3.0"