[package]
name = "pn-gateway"
version = "0.1.0"
edition = "2021"
description = "PN Gateway - Bridge layer between PRoot, PRoot-distro, and proot-compat"
license = "GPL-2.0-or-later"
repository = "https://github.com/hermes-agent/PDN"

[features]
default = []
profiling = ["dep:pprof", "dep:flamegraph"]

[dependencies]
proot-core = { path = "../proot-core" }
proot-distro-core = { path = "../proot-distro-core" }
proot-compat = { path = "../proot-compat" }
libc = "0.2"
nix = { version = "0.27", features = ["mount", "process"] }
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
pprof = { version = "0.12", optional = true }
flamegraph = { version = "0.6", optional = true }

[[bench]]
name = "benchmarks"
path = "benches/benchmarks.rs"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1.0", features = ["full", "macros"] }