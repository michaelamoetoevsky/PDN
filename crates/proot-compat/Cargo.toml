[package]
name = "proot-compat"
version.workspace = true
edition.workspace = true
description = "PRoot compatibility layer for Termux Android 16+"
license.workspace = true
repository.workspace = true

[dependencies]
proot-core = { path = "../proot-core" }
libc = "0.2"
nix = { version = "0.27", features = ["mount"] }
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.0"
serial_test = "2.0"
libfuzzer-sys = "0.4"