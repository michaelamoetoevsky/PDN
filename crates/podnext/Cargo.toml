[package]
name = "podnext"
version.workspace = true
edition.workspace = true
description = "podnext - PRoot Distro Next CLI for Termux/Android"
license.workspace = true
repository.workspace = true

[[bin]]
name = "podnext"
path = "src/main.rs"

[[bin]]
name = "podnext-daemon"
path = "src/daemon.rs"

[dependencies]
pn-gateway = { path = "../pn-gateway" }
pn-next = { path = "../pn-next" }
proot-distro-core = { path = "../proot-distro-core" }
proot-core = { path = "../proot-core" }
proot-compat = { path = "../proot-compat" }
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console = "0.15"
indicatif = "0.17"
tabled = "0.16"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
urlencoding = "2.1"
dirs = "5.0"
tar = "0.4"
flate2 = "1.0"
oci-spec = "0.10"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
strum = { version = "0.25", features = ["derive"] }
serde_yaml = "0.9"