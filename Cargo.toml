[workspace]
resolver = "2"
members = [
    "crates/proot-core",
    "crates/proot-distro-core",
    "crates/proot-compat",
    "crates/pn-gateway",
    "crates/pn-next",
    "crates/podnext",
]
exclude = [
    "fuzz",
]

# Single source of truth for crate versions: `version.workspace = true` in each crate
[workspace.package]
version = "0.1.8"
edition = "2021"
license = "GPL-2.0-or-later"
repository = "https://github.com/michaelamoetoevsky/PDN"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
nix = { version = "0.27", features = ["mount"] }
libc = "0.2"
rustix = "0.38"
bytes = "1.0"
tempfile = "3.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package]
name = "pdn-integration-tests"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
autotests = false
autobenches = false
autoexamples = false
publish = false

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
bytes = { workspace = true }
pn-next = { path = "crates/pn-next" }
toml = "0.8"
chrono = { workspace = true }
uuid = { workspace = true }

[[test]]
name = "v2_criteria"
path = "tests/integration/v2_criteria.rs"

[[test]]
name = "daemon_integration_test"
path = "tests/daemon_integration_test.rs"

