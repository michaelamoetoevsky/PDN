# PRoot Distro Next (PDN) - Next Generation PRoot Architecture

[workspace]
resolver = "2"
members = [
    "crates/proot-core",
    "crates/proot-distro-core",
    "crates/proot-compat",
    "crates/pn-gateway",
    "crates/pn-next",
    "crates/pn-cli",
]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
nix = { version = "0.27", features = ["mount"] }
libc = "0.2"
rustix = "0.38"
bytes = "1.0"
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"