[book]
title = "PDN - PRoot Distro Next"
description = "Next-generation container platform for Termux/Android"
authors = ["PDN Contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false
use-default-preprocessors = true

[output.html]
mathjax-support = false
additional-css = ["custom.css"]
additional-js = ["custom.js"]
no-section-label = false
git-repository-url = "https://github.com/michaelamoetoevsky/PDN"
edit-url-template = "https://github.com/michaelamoetoevsky/PDN/edit/main/docs/src/{path}"
default-theme = "light"
preferred-dark-theme = "dark"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 10

[output.html.print]
enable = false

[preprocessor.links]

[preprocessor.index]

[preprocessor.plantuml]
optional = true

[preprocessor.mathjax]
optional = true